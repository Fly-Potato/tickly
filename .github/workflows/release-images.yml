name: 发布镜像

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: 发布前全量检查
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 安装固定工具链
        uses: jdx/mise-action@v4.2.5

      - name: 固定 pnpm 版本
        run: mise install pnpm@11.16.0

      - name: 安装 JavaScript 依赖
        run: mise exec pnpm@11.16.0 -- pnpm install --frozen-lockfile

      - name: 安装 API 依赖
        run: mise exec -- uv sync --project apps/api --locked

      - name: 安装 MCP 依赖
        run: mise exec -- uv sync --project apps/mcp --locked

      - name: 执行全量检查
        run: mise exec pnpm@11.16.0 -- pnpm check

  publish-images:
    name: 发布 ${{ matrix.image }} 镜像
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
          - image: mcp
            dockerfile: apps/mcp/Dockerfile
          - image: web
            dockerfile: apps/web/Dockerfile

    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 规范化镜像名称
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/tickly-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: 安装 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 安装 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像元数据
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: 构建并推送多架构镜像
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=tickly-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=tickly-${{ matrix.image }}

      - name: 生成镜像来源证明
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
