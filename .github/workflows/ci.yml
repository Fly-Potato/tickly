name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 检测变更范围
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ steps.scope.outputs.web }}
      api: ${{ steps.scope.outputs.api }}
      mcp: ${{ steps.scope.outputs.mcp }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30af803 # v6
        with:
          fetch-depth: 0

      - name: 计算受影响应用
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            changed=$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")
          else
            changed=$(git diff --name-only "$base" "$HEAD_SHA")
          fi

          web=false
          api=false
          mcp=false
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              apps/web/*|pnpm-lock.yaml|pnpm-workspace.yaml)
                web=true
                ;;
              package.json)
                web=true
                api=true
                mcp=true
                ;;
              apps/api/*)
                api=true
                ;;
              apps/mcp/*)
                mcp=true
                ;;
              mise.toml)
                web=true
                api=true
                mcp=true
                ;;
              docs/*|README.md|AGENTS.md|.gitignore|.dockerignore)
                ;;
              *)
                web=true
                api=true
                mcp=true
                ;;
            esac
            if [[ "$path" == apps/api/app/* ]]; then
              mcp=true
            fi
          done <<< "$changed"

          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "mcp=$mcp" >> "$GITHUB_OUTPUT"

  web:
    name: Web 检查
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 安装固定工具链
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: 固定 pnpm 版本
        run: mise install pnpm@11.16.0

      - name: 安装 JavaScript 依赖
        run: mise exec pnpm@11.16.0 -- pnpm install --frozen-lockfile

      - name: 执行 Web 检查
        run: |
          mise exec pnpm@11.16.0 -- pnpm lint
          mise exec pnpm@11.16.0 -- pnpm typecheck
          mise exec pnpm@11.16.0 -- pnpm build
          mise exec pnpm@11.16.0 -- pnpm test:web

  api:
    name: API 检查
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30af803 # v6

      - name: 安装固定工具链
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: 安装 API 依赖
        run: mise exec -- uv sync --project apps/api --locked

      - name: 执行 API 测试
        run: mise exec -- pnpm test:api

  mcp:
    name: MCP 检查
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 安装固定工具链
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: 安装 MCP 依赖
        run: mise exec -- uv sync --project apps/mcp --locked

      - name: 执行 MCP 测试
        run: mise exec -- pnpm test:mcp
