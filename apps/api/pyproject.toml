[project]
name = "tickly-api"
version = "0.1.0"
description = "Tickly FastAPI service"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "fastapi[standard]>=0.140.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
