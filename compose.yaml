services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      TICKLY_DATABASE_URL: sqlite:////data/tickly.db
      TICKLY_ENVIRONMENT: production
      TICKLY_JWT_SECRET: ${TICKLY_JWT_SECRET:?TICKLY_JWT_SECRET is required}
      TICKLY_LOG_JSON: "true"
      TICKLY_REFRESH_COOKIE_SECURE: ${TICKLY_REFRESH_COOKIE_SECURE:-true}
    expose:
      - "8000"
    volumes:
      - tickly-data:/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1:8080/]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  tickly-data:
