services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      TICKLY_ENVIRONMENT: production
      TICKLY_LOG_JSON: "true"
    expose:
      - "8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1:8080/]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
